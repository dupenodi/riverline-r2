[project]
name = "riverline-agent"
version = "0.1.0"
description = "Kubera voice agent (Pipecat + Daily)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.11.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pipecat-ai[daily,openrouter,sarvam,silero]>=1.10.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# The agent modules sit flat in this directory rather than in a package, so
# tests import them the same way server.py does.
pythonpath = ["."]
testpaths = ["tests"]
